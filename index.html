<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Multi-User Search</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 640px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            background: #fff;
            color: #1f2328;
        }

        input[type="text"] {
            width: 70%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            background: #2da44e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 8px;
        }

        button:hover {
            background: #2c974b;
        }

        .search-types {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 16px 0 20px;
        }

        .search-types label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border: 1px solid #d0d7de;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            user-select: none;
        }

        .search-types label:has(input:checked),
        .search-types label:has(input:indeterminate) {
            background: #ddf4ff;
            border-color: #54aeff;
        }

        .search-types input {
            margin: 0;
        }

        .author-filter,
        .state-filter {
            margin: 0 0 16px;
        }

        .author-filter > label,
        .state-filter > label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .author-filter input[type="text"] {
            width: 50%;
        }

        .author-filter input:disabled,
        .state-filter input:disabled {
            background: #f6f8fa;
            color: #8c959f;
            cursor: not-allowed;
        }

        .state-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .state-options label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border: 1px solid #d0d7de;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            user-select: none;
        }

        .state-options label:has(input:checked) {
            background: #ddf4ff;
            border-color: #54aeff;
        }

        .state-options label:has(input:disabled) {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .filter-hint {
            color: #656d76;
            font-size: 13px;
            margin: 6px 0 0;
        }

        .tab-hint {
            color: #656d76;
            font-size: 14px;
            margin: 0 0 8px;
        }

        #openedSearches {
            margin-top: 24px;
            text-align: left;
        }

        #openedSearches ul {
            padding-left: 20px;
        }
    </style>
</head>

<body>
    <h1>Search KERI-related GitHub Repositories</h1>
    <p>Search in: keri-foundation, trustoverip, blockchainbird</p>

    <form id="searchForm">
        <input type="text" id="searchTerm" placeholder="Enter search term..." required>
        <button type="submit">Search</button>
        <div class="search-types" role="group" aria-label="Search types">
            <label><input type="checkbox" id="selectAll" checked> All</label>
            <label><input type="checkbox" name="searchType" value="code" checked> Code</label>
            <label><input type="checkbox" name="searchType" value="repositories" checked> Repositories</label>
            <label><input type="checkbox" name="searchType" value="issues" checked> Issues</label>
            <label><input type="checkbox" name="searchType" value="pullrequests" checked> Pull requests</label>
            <label><input type="checkbox" name="searchType" value="discussions" checked> Discussions</label>
            <label><input type="checkbox" name="searchType" value="commits" checked> Commits</label>
        </div>
        <div class="author-filter">
            <label for="author">Author</label>
            <input type="text" id="author" placeholder="Optional, e.g. kordwarshuis" autocomplete="username" spellcheck="false">
            <p class="filter-hint">Limits issues, pull requests, discussions, and commits to that GitHub user.</p>
        </div>
        <div class="state-filter">
            <label id="issueStateLabel">Issue state</label>
            <div class="state-options" role="radiogroup" aria-labelledby="issueStateLabel">
                <label><input type="radio" name="issueState" value="" checked> All</label>
                <label><input type="radio" name="issueState" value="open"> Open</label>
                <label><input type="radio" name="issueState" value="closed"> Closed</label>
            </div>
            <p class="filter-hint">Limits issues and pull requests to open or closed.</p>
        </div>
        <p class="tab-hint">Each selected type opens in a new browser tab.</p>
    </form>
    <div id="openedSearches" hidden></div>

    <script>
        const OWNERS = ['keri-foundation', 'trustoverip', 'blockchainbird'];
        const TYPE_LABELS = {
            code: 'Code',
            repositories: 'Repositories',
            issues: 'Issues',
            pullrequests: 'Pull requests',
            discussions: 'Discussions',
            commits: 'Commits',
        };
        const AUTHOR_TYPES = new Set(['issues', 'pullrequests', 'discussions', 'commits']);
        const STATE_TYPES = new Set(['issues', 'pullrequests']);
        const STATE_LABELS = { open: 'Open', closed: 'Closed' };

        const selectAll = document.getElementById('selectAll');
        const typeBoxes = [...document.querySelectorAll('input[name="searchType"]')];
        const stateBoxes = [...document.querySelectorAll('input[name="issueState"]')];
        const authorInput = document.getElementById('author');
        const openedSearches = document.getElementById('openedSearches');

        function ownersQuery(type) {
            // Code search ANDs adjacent user: filters, so those need explicit OR.
            // Issues search ignores that OR group and returns 0 hits; there,
            // repeated user: filters are treated as OR.
            if (type === 'code') {
                return '(' + OWNERS.map((owner) => `user:${owner}`).join(' OR ') + ')';
            }
            return OWNERS.map((owner) => `user:${owner}`).join(' ');
        }

        function normalizeAuthor(value) {
            return value.trim().replace(/^@/, '');
        }

        function selectedState() {
            const checked = stateBoxes.find((box) => box.checked);
            return checked ? checked.value : '';
        }

        function searchUrl(term, type, author, state) {
            let query = `${term} ${ownersQuery(type)}`;
            if (author && AUTHOR_TYPES.has(type)) {
                query += ` author:${author}`;
            }
            if (state && STATE_TYPES.has(type)) {
                query += ` is:${state}`;
            }
            return `https://github.com/search?q=${encodeURIComponent(query)}&type=${type}`;
        }

        function searchLabel(type, author, state) {
            let label = TYPE_LABELS[type];
            if (state && STATE_TYPES.has(type)) {
                label = `${STATE_LABELS[state]} ${label.toLowerCase()}`;
            }
            if (author && AUTHOR_TYPES.has(type)) {
                return `${label} by ${author}`;
            }
            return label;
        }

        function syncAuthorFilter() {
            const enabled = typeBoxes.some((box) => box.checked && AUTHOR_TYPES.has(box.value));
            authorInput.disabled = !enabled;
        }

        function syncStateFilter() {
            const enabled = typeBoxes.some((box) => box.checked && STATE_TYPES.has(box.value));
            stateBoxes.forEach((box) => {
                box.disabled = !enabled;
            });
        }

        function syncSelectAll() {
            const checkedCount = typeBoxes.filter((box) => box.checked).length;
            selectAll.checked = checkedCount === typeBoxes.length;
            selectAll.indeterminate = checkedCount > 0 && checkedCount < typeBoxes.length;
        }

        selectAll.addEventListener('change', function () {
            typeBoxes.forEach((box) => {
                box.checked = selectAll.checked;
            });
            selectAll.indeterminate = false;
            syncAuthorFilter();
            syncStateFilter();
        });

        typeBoxes.forEach((box) => {
            box.addEventListener('change', function () {
                syncSelectAll();
                syncAuthorFilter();
                syncStateFilter();
            });
        });

        syncAuthorFilter();
        syncStateFilter();

        document.getElementById('searchForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const term = document.getElementById('searchTerm').value.trim();
            if (!term) return;

            const types = typeBoxes.filter((box) => box.checked).map((box) => box.value);
            if (!types.length) return;

            const author = normalizeAuthor(authorInput.value);
            const state = selectedState();
            const searches = types.map((type) => ({
                label: searchLabel(type, author, state),
                url: searchUrl(term, type, author, state),
            }));

            openedSearches.hidden = false;
            openedSearches.innerHTML =
                '<p>Opened in new tabs. If a tab was blocked, use these links:</p><ul>' +
                searches.map((search) => `<li><a href="${search.url}" target="_blank" rel="noopener">${search.label}</a></li>`).join('') +
                '</ul>';

            searches.forEach((search) => window.open(search.url, '_blank'));
        });
    </script>
</body>

</html>
